# Builds the macOS disk image, which cannot be produced on Windows: jpackage only emits the
# format of the system it runs on. Started by hand, and attaches the .dmg to an existing release.
name: Pacchetto macOS (.dmg)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release a cui allegare il .dmg"
        required: true
        default: "v2.14.3-3"
      versione:
        description: "Versione dell'applicazione"
        required: true
        default: "2.14.3"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14

    steps:
      # Si costruisce esattamente il codice del tag a cui il pacchetto verra' allegato: senza
      # indicare il riferimento si prenderebbe il ramo corrente, e la release finirebbe per
      # contenere un pacchetto costruito da sorgenti diversi da quelli che dichiara.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "25"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: go-task
        run: brew install go-task

      # Il frontend lo costruisce Gradle, con la sequenza del progetto (task frontend:build:core):
      # invocare vite a mano salta il passo che genera dist/index.html, atteso dal plugin
      # prerender-og, e su una copia pulita la build si ferma li'.
      - name: Compila frontend e jar
        env:
          DISABLE_ADDITIONAL_FEATURES: "true"
        run: ./gradlew bootJar -PbuildWithFrontend=true --no-daemon

      # InitialSetup pretende questi quattro modelli nel classpath e interrompe l'avvio se ne
      # manca uno. Un file escluso per sbaglio dal repository non deve arrivare fino al pacchetto:
      # meglio fermarsi qui, dove il rimedio e' evidente.
      - name: Risorse obbligatorie nel jar
        run: |
          JAR="$(find app/core/build/libs -maxdepth 1 -name 'stirling-pdf-*.jar' -print -quit)"
          echo "jar: $JAR"
          MANCANTI=0
          for nome in \
            "OCR images.json" \
            "Prepare-pdfs-for-email.json" \
            "Pre-publish-sanitization.json" \
            "split-rotate-auto-rename.json"
          do
            voce="BOOT-INF/classes/static/pipeline/defaultWebUIConfigs/$nome"
            if unzip -Z1 "$JAR" | grep -Fxq -- "$voce"; then
              echo "presente: $nome"
            else
              echo "::error::risorsa obbligatoria assente dal jar: $voce"
              MANCANTI=1
            fi
          done
          exit $MANCANTI

      # jpackage wants an .icns, and macOS builds one from the PNG with the tools it already has.
      - name: Icona
        run: |
          mkdir -p icona.iconset
          for misura in 16 32 128 256 512; do
            sips -z $misura $misura packaging/icone/logo-1024.png --out icona.iconset/icon_${misura}x${misura}.png
            doppia=$((misura * 2))
            sips -z $doppia $doppia packaging/icone/logo-1024.png --out icona.iconset/icon_${misura}x${misura}@2x.png
          done
          iconutil -c icns icona.iconset -o lawyers-pdf.icns

      # In due passi, non uno. Su Apple Silicon ogni binario deve portare almeno una firma
      # ad-hoc: senza, il sistema termina il processo appena parte. jpackage non la applica
      # quando non gli si indica un'identita', quindi si costruisce prima l'applicazione, la si
      # firma, e solo allora la si impacchetta nel disco.
      - name: jpackage - immagine dell'applicazione
        run: |
          mkdir -p jp-input immagine dist
          cp app/core/build/libs/stirling-pdf-*.jar jp-input/
          NOME_JAR=$(basename $(ls jp-input/*.jar))
          jpackage --type app-image \
            --name "Lawyers-PDF" \
            --app-version "${{ inputs.versione }}" \
            --vendor "Avv. Roberto Arcella" \
            --description "Lawyers-PDF - un fork di Stirling PDF" \
            --input jp-input \
            --main-jar "$NOME_JAR" \
            --icon lawyers-pdf.icns \
            --java-options "-DBROWSER_OPEN=true" \
            --java-options "-Xmx2g" \
            --dest immagine

      # `--deep` e' un rimedio d'emergenza, non un modo di firmare: procede dall'esterno verso
      # l'interno e lascia sigilli che un passo successivo puo' invalidare senza che nulla se ne
      # accorga. Si firma nell'ordine giusto - prima i binari, poi il runtime, infine il bundle.
      - name: Firma ad-hoc
        run: |
          APP="immagine/Lawyers-PDF.app"
          find "$APP" -type f -perm -u+x -print0 | while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              codesign --force --sign - "$f"
            fi
          done
          codesign --force --sign - "$APP/Contents/runtime"
          codesign --force --sign - "$APP"
          codesign --verify --strict --deep --verbose=2 "$APP"

      - name: jpackage - disco
        run: |
          jpackage --type dmg \
            --name "Lawyers-PDF" \
            --app-version "${{ inputs.versione }}" \
            --vendor "Avv. Roberto Arcella" \
            --app-image "immagine/Lawyers-PDF.app" \
            --dest dist
          mv "$(ls dist/*.dmg | head -1)" "dist/Lawyers-PDF-${{ inputs.versione }}-macos-arm64.dmg"

      # La prova di avvio girava sull'immagine dell'applicazione, cioe' su un artefatto diverso da
      # quello che viene pubblicato: un difetto introdotto dall'impacchettamento passava indenne, e
      # infatti e' passato. Si prova il disco. L'applicazione si copia fuori come farebbe chi la
      # installa, con l'attributo di quarantena che macOS mette a tutto cio' che arriva dalla rete,
      # e si avvia da li'. Se il sigillo e' saltato il processo muore subito e senza registro; se e'
      # l'applicazione a fermarsi, il motivo sta nel registro. I due casi si distinguono in fondo.
      - name: Prova di avvio dal disco
        run: |
          DISCO="$(ls dist/*.dmg | head -1)"
          hdiutil attach "$DISCO" -mountpoint /Volumes/prova -nobrowse -readonly
          codesign --verify --strict --deep --verbose=4 "/Volumes/prova/Lawyers-PDF.app"
          mkdir -p installata
          ditto "/Volumes/prova/Lawyers-PDF.app" "installata/Lawyers-PDF.app"
          hdiutil detach /Volumes/prova
          xattr -w com.apple.quarantine "0081;00000000;Safari;" "installata/Lawyers-PDF.app"
          codesign --verify --strict --deep --verbose=4 "installata/Lawyers-PDF.app"

          OCCUPANTI="$(lsof -ti tcp:8080 || true)"
          if [ -n "$OCCUPANTI" ]; then kill -9 $OCCUPANTI; sleep 2; fi

          "installata/Lawyers-PDF.app/Contents/MacOS/Lawyers-PDF" > avvio.log 2>&1 &
          PID=$!
          RISPOSTA=""
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/info/status > risposta.json 2>/dev/null; then
              RISPOSTA=$(cat risposta.json)
              break
            fi
            sleep 3
          done
          if [ -z "$RISPOSTA" ]; then
            echo "::error::il pacchetto non ha risposto entro tre minuti"
            echo "--- uscita del processo ---"; tail -80 avvio.log || true
            echo "--- registro dell'applicazione ---"
            tail -120 "$HOME/Library/Application Support/Lawyers-PDF/logs/info.log" 2>/dev/null \
              || echo "(nessun registro: l'applicazione non e' arrivata ad aprirlo)"
            kill $PID 2>/dev/null || true
            exit 1
          fi
          echo "avviata e in ascolto: $RISPOSTA"
          kill $PID 2>/dev/null || true

      - name: Conserva il pacchetto come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: Lawyers-PDF-macos
          path: dist/*.dmg

      - name: Allega alla release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/*.dmg --clobber
